<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>각자ON 개편 · 화면 검수</title><style>body{font:15px/1.8 system-ui,sans-serif;max-width:1400px;margin:48px auto;padding:0 24px;background:#f5f9f6;color:#20392d}h1{font-size:28px}h2{font-size:21px;margin-top:52px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:24px}figure{margin:0;background:white;border-radius:24px;padding:16px;box-shadow:10px 10px 28px #25483312,-8px -8px 22px #fff}img{display:block;width:100%;height:420px;object-fit:contain;object-position:top;border-radius:14px;background:#f5f9f6}figcaption{padding:12px 4px 4px;color:#52675b}a{color:#087543}.note{border-left:4px solid #00ed77;padding:14px 20px;background:white;border-radius:10px}</style><h1>각자ON 전체 개편 · 시각 QA</h1><p>2026년 10월 23일 · 로고 초록과 학교 선택 화면을 기준으로 정돈한 클레이 UI</p><p class="note">계정과 생기부·답변은 검수용 가상 자료입니다. 면접 중·도움·실전·종료 화면은 실제 컴포넌트에 가상 컨트롤러를 연결한 상태입니다. 실제 서버의 면접 준비 화면은 별도 표시했습니다. 유료 AI와 실제 카메라·마이크는 사용하지 않았습니다. 이미지를 누르면 원본 크기로 열립니다.</p><section><h2>스타일 비교</h2><div class="grid"><figure><a href="design-comparison.jpg" target="_blank"><img loading="lazy" src="design-comparison.jpg" alt="학교 선택 화면의 여백·초록 포인트를 공통 디자인으로 확장"></a><figcaption>학교 선택 화면의 여백·초록 포인트를 공통 디자인으로 확장</figcaption></figure></div></section><section><h2>데스크톱</h2><div class="grid"><figure><a href="screenshots/home-desktop-final.jpg" target="_blank"><img loading="lazy" src="screenshots/home-desktop-final.jpg" alt="홈 · 두 개의 시작점"></a><figcaption>홈 · 두 개의 시작점</figcaption></figure><figure><a href="screenshots/dashboard-desktop-final.jpg" target="_blank"><img loading="lazy" src="screenshots/dashboard-desktop-final.jpg" alt="대시보드 · 실제 완료 기록과 일정"></a><figcaption>대시보드 · 실제 완료 기록과 일정</figcaption></figure><figure><a href="screenshots/training-desktop-final.jpg" target="_blank"><img loading="lazy" src="screenshots/training-desktop-final.jpg" alt="오늘 훈련 · 한 영역과 네 단계"></a><figcaption>오늘 훈련 ·
