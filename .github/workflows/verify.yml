name: Verify source and offline behavior
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/contracts/requirements-validation.txt
      - run: python -m pip install -r packages/contracts/requirements-validation.txt
      - run: npm run verify:contracts
      - run: npm run verify:domain-contracts
      - run: node scripts/verify-source-closure.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:portable
      - run: npm run build
